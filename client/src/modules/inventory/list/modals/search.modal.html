<form name="ModalForm" ng-submit="ModalCtrl.submit(ModalForm)" novalidate data-modal="inventory-search">

  <div class="modal-header">
    <ol class="headercrumb">
      <li class="static" translate>TREE.INVENTORY</li>
      <li class="title" translate>FORM.INFO.SEARCH</li>
    </ol>
  </div>

  <div class="modal-body search-modal">
    <uib-tabset>
      <uib-tab index="0" heading="{{ 'FORM.LABELS.SEARCH_QUERIES' | translate }}" data-custom-filter-tab>
        <div class="tab-body">

          <bh-inventory-group-select
            group-uuid="ModalCtrl.searchQueries.group_uuid"
            name="group_uuid"
            on-select-callback="ModalCtrl.onSelectGroup(group)">
            <bh-clear on-clear="ModalCtrl.clear('group_uuid')"></bh-clear>
          </bh-inventory-group-select>

          <div class="form-group" ng-class="{ 'has-error' : ModalForm.$submitted && ModalForm.text.$invalid }">
            <label class="control-label" translate>
              FORM.LABELS.LABEL
            </label>
            <bh-clear on-clear="ModalCtrl.clear('text')"></bh-clear>

            <input type="text" class="form-control" name="text" ng-model="ModalCtrl.searchQueries.text">
            <div class="help-block" ng-messages="ModalForm.text.$error" ng-show="ModalForm.$submitted">
              <div ng-messages-include="modules/templates/messages.tmpl.html"></div>
            </div>
          </div>

          <div class="form-group" ng-class="{ 'has-error' : ModalForm.$submitted && ModalForm.reference_number.$invalid }">
            <label class="control-label" translate>
              FORM.LABELS.REFERENCE_NUMBER
            </label>
            <bh-clear on-clear="ModalCtrl.clear('reference_number')"></bh-clear>

            <input type="text" class="form-control" name="reference_number" ng-model="ModalCtrl.searchQueries.reference_number">
            <div class="help-block" ng-messages="ModalForm.reference_number.$error" ng-show="ModalForm.$submitted">
              <div ng-messages-include="modules/templates/messages.tmpl.html"></div>
            </div>
          </div>

          <div class="form-group" ng-class="{ 'has-error' : ModalForm.$submitted && ModalForm.manufacturer_brand.$invalid }">
            <label class="control-label" translate>
              FORM.LABELS.MANUFACTURER_BRAND
            </label>
            <bh-clear on-clear="ModalCtrl.clear('manufacturer_brand')"></bh-clear>

            <input type="text" class="form-control" name="manufacturer_brand" ng-model="ModalCtrl.searchQueries.manufacturer_brand">
            <div class="help-block" ng-messages="ModalForm.manufacturer_brand.$error" ng-show="ModalForm.$submitted">
              <div ng-messages-include="modules/templates/messages.tmpl.html"></div>
            </div>
          </div>

          <div class="form-group" ng-class="{ 'has-error' : ModalForm.$submitted && ModalForm.manufacturer_model.$invalid }">
            <label class="control-label" translate>
              FORM.LABELS.MANUFACTURER_MODEL
            </label>
            <bh-clear on-clear="ModalCtrl.clear('manufacturer_model')"></bh-clear>

            <input type="text" class="form-control" name="manufacturer_model" ng-model="ModalCtrl.searchQueries.manufacturer_model">
            <div class="help-block" ng-messages="ModalForm.manufacturer_model.$error" ng-show="ModalForm.$submitted">
              <div ng-messages-include="modules/templates/messages.tmpl.html"></div>
            </div>
          </div>

          <div class="form-group" ng-class="{ 'has-error' : ModalForm.$submitted && ModalForm.code.$invalid }">
            <label class="control-label" translate>
              FORM.LABELS.CODE
            </label>
            <bh-clear on-clear="ModalCtrl.clear('code')"></bh-clear>

            <input type="text" class="form-control" name="code" ng-model="ModalCtrl.searchQueries.code">
            <div class="help-block" ng-messages="ModalForm.code.$error" ng-show="ModalForm.$submitted">
              <div ng-messages-include="modules/templates/messages.tmpl.html"></div>
            </div>
          </div>

          <div class="form-group" ng-class="{ 'has-error' : ModalForm.$submitted && ModalForm.price.$invalid }">
            <label class="control-label" translate>
              FORM.LABELS.UNIT_PRICE
            </label>
            <bh-clear on-clear="ModalCtrl.clear('price')"></bh-clear>

            <input type="number" class="form-control" name="price" ng-model="ModalCtrl.searchQueries.price">
            <div class="help-block" ng-messages="ModalForm.price.$error" ng-show="ModalForm.$submitted">
              <div ng-messages-include="modules/templates/messages.tmpl.html"></div>
            </div>
          </div>

          <bh-inventory-type-select
            type-id="ModalCtrl.searchQueries.type_id"
            name="type_id"
            on-select-callback="ModalCtrl.onSelectType(type)">
            <bh-clear on-clear="ModalCtrl.clear('type_id')"></bh-clear>
          </bh-inventory-type-select>

          <br/>

          <bh-tag-select
            tag-uuids="ModalCtrl.searchQueries.tags"
            on-select-callback="ModalCtrl.onSelectTags(tags)">
          </bh-tag-select>

          <!-- user -->
          <bh-user-select
            user-id="ModalCtrl.searchQueries.updated_by"
            label="FORM.LABELS.LAST_USER_UPDATE"
            required="false"
            on-select-callback="ModalCtrl.onSelectUserUpdate(user)">
            <bh-clear on-clear="ModalCtrl.clear('updated_by')"></bh-clear>
         </bh-user-select>

          <div class="form-group">
            <bh-clear on-clear="ModalCtrl.clear('consumable')"></bh-clear>
            <label class="control-label" translate>
              FORM.LABELS.CONSUMABLE
            </label>
            <div ng-class="{ 'has-error' : ModalForm.$submitted && ModalForm.consumable.$invalid }"></div>

            <label class="radio-inline">
              <input type="radio" value='1' name="consumable" ng-model="ModalCtrl.searchQueries.consumable">
              <span translate>FORM.LABELS.YES</span>
            </label>

            <label class="radio-inline">
              <input type="radio" value='0' name="consumable" ng-model="ModalCtrl.searchQueries.consumable">
              <span translate>FORM.LABELS.NO</span>
            </label>
          </div>

          <div class="form-group">
            <bh-clear on-clear="ModalCtrl.clear('is_asset')"></bh-clear>
            <label class="control-label" translate>
              FORM.LABELS.ASSET
            </label>
            <div ng-class="{ 'has-error' : ModalForm.$submitted && ModalForm.is_asset.$invalid }">
              <label class="radio-inline">
                <input type="radio" value='1' name="is_asset" ng-model="ModalCtrl.searchQueries.is_asset">
                <span translate>FORM.LABELS.YES</span>
              </label>
              <label class="radio-inline">
                <input type="radio" value='0' name="is_asset" ng-model="ModalCtrl.searchQueries.is_asset">
                <span translate>FORM.LABELS.NO</span>
              </label>
            </div>
          </div>

          <div class="form-group">
            <bh-clear on-clear="ModalCtrl.clear('locked')"></bh-clear>
            <label class="control-label" translate>
              FORM.LABELS.LOCKED
            </label>
            <div ng-class="{ 'has-error' : ModalForm.$submitted && ModalForm.locked.$invalid }">
              <label class="radio-inline">
                <input type="radio" value='1' name="locked" ng-model="ModalCtrl.searchQueries.locked">
                <span translate>FORM.LABELS.YES</span>
              </label>
              <label class="radio-inline">
                <input type="radio" value='0' name="locked" ng-model="ModalCtrl.searchQueries.locked">
                <span translate>FORM.LABELS.NO</span>
              </label>
            </div>
          </div>

          <div class="form-group">
            <bh-clear on-clear="ModalCtrl.clear('hidden')"></bh-clear>
            <label class="control-label" translate>
              FORM.LABELS.HIDDEN
            </label>
            <div ng-class="{ 'has-error' : ModalForm.$submitted && ModalForm.hidden.$invalid }">
              <label class="radio-inline">
                <input type="radio" value='1' name="hidden" ng-model="ModalCtrl.searchQueries.hidden">
                <span translate>FORM.LABELS.YES</span>
              </label>
              <label class="radio-inline">
                <input type="radio" value='0' name="hidden" ng-model="ModalCtrl.searchQueries.hidden">
                <span translate>FORM.LABELS.NO</span>
              </label>
            </div>
          </div>

          <!-- updated_at -->
          <bh-date-interval
            label="FORM.LABELS.LAST_UPDATE"
            date-id="updated_at"
            date-from="ModalCtrl.searchQueries.updated_at_from"
            date-to="ModalCtrl.searchQueries.updated_at_to"
            on-change="ModalCtrl.onUpdateAt(dateFrom, dateTo)">
          </bh-date-interval>
        </div>
      </uib-tab>

      <uib-tab index="1" heading="{{ 'FORM.LABELS.DEFAULTS' | translate }}" data-default-filter-tab>
        <div class="tab-body">
          <div class="form-group" ng-class="{ 'has-error' : ModalForm.limit.$invalid }">
            <label class="control-label" translate>FORM.LABELS.LIMIT</label>
            <input name="limit" type="number" min="0" bh-integer class="form-control" ng-model="ModalCtrl.defaultQueries.limit" ng-change="ModalCtrl.onSelectLimit(ModalCtrl.defaultQueries.limit)">
            <div class="help-block" ng-messages="ModalForm.limit.$error">
              <div ng-messages-include="modules/templates/messages.tmpl.html"></div>
            </div>
          </div>
        </div>
      </uib-tab>

    </uib-tabset>
  </div>

  <div class="modal-footer">
    <button type="button" class="btn btn-default" ng-click="ModalCtrl.cancel()" data-method="cancel" translate>
      FORM.BUTTONS.CLOSE
    </button>
    <button type="submit" class="btn btn-primary" data-method="submit" translate>
      FORM.BUTTONS.SUBMIT
    </button>
  </div>
</form>
