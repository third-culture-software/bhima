<bh-report-preview
  ng-if="ReportConfigCtrl.previewGenerated"
  source-document="ReportConfigCtrl.previewResult"
  on-clear-callback="ReportConfigCtrl.clearPreview()"
  on-save-callback="ReportConfigCtrl.requestSaveAs()">
</bh-report-preview>

<div ng-show="!ReportConfigCtrl.previewGenerated">
  <div class="row">
    <div class="col-md-12">
      <h3 translate>REPORT.STOCK.EXIT_REPORT</h3>
      <p class="text-info" translate>REPORT.STOCK.EXIT_REPORT_DESCRIPTION</p>
    </div>
  </div>

  <div class="row" style="margin-top : 10px">
    <div class="col-md-6">
      <div class="panel panel-default">
        <div class="panel-heading">
          <span translate>REPORT.UTIL.OPTIONS</span>
        </div>

        <div class="panel-body">
          <form name="ConfigForm" bh-submit="ReportConfigCtrl.preview(ConfigForm)" novalidate autocomplete="off">

            <!-- select depot -->
            <bh-depot-select
              depot-uuid="ReportConfigCtrl.reportDetails.depotUuid"
              on-select-callback="ReportConfigCtrl.onSelectDepot(depot)"
              filter-management-supervision="true"
              required="true">
            </bh-depot-select>

            <!-- date interval -->
            <bh-date-interval
              date-from="ReportConfigCtrl.reportDetails.dateFrom"
              date-to="ReportConfigCtrl.reportDetails.dateTo"
              limit-min-fiscal
              required="true">
            </bh-date-interval>

            <bh-currency-select
              currency-id="ReportConfigCtrl.reportDetails.currency_id"
              on-change="ReportConfigCtrl.onSelectCurrency(currency)" >
            </bh-currency-select>

            <!-- data to include in report -->
            <bh-checkbox-tree
              data="ReportConfigCtrl.options"
              checked-ids="ReportConfigCtrl.reportDetails.checkedOptions"
              on-change="ReportConfigCtrl.onChangeOptions(data)"
              is-flat-tree>
            </bh-checkbox-tree>

            <div ng-if="ConfigForm.$submitted && !ReportConfigCtrl.reportDetails.checkedOptions.length">
              <p class="text-danger" translate>STOCK.AT_LEAST_ONE_CHECKED</p>
            </div>

            <hr />

            <div class="checkbox">
              <label>
                <input type="checkbox" ng-true-value="1" ng-false-value="0" ng-model="ReportConfigCtrl.reportDetails.showDetails">
                <span translate>REPORT.STOCK.SHOW_DETAILS</span>
              </label>
            </div>

            <bh-loading-button loading-state="ConfigForm.$loading">
              <span translate>REPORT.UTIL.PREVIEW</span>
            </bh-loading-button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
