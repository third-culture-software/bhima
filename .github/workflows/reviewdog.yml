name: reviewdog
on: [pull_request]
jobs:
  eslint:
    name: Lint (ESLint & ShellCheck)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      issues: write
      pull-requests: write
    steps:
      - run: echo "The job was automatically triggered by a ${{ github.event_name }} event."
      - run: echo "This job is now running on a ${{ runner.os }} server hosted by GitHub!"
      - run: echo "The name of your branch is ${{ github.ref }} and your repository is ${{ github.repository }}."

      - name: Check out repository code
        uses: actions/checkout@v7.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: echo "The ${{ github.repository }} repository has been cloned to the runner."

      # setup Node.js environment
      - name: Setup Node.js environment
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # set up reviewdog
      - name: Setup reviewdog for linting
        uses: reviewdog/action-setup@v1.5.0

      - run: reviewdog -version

      # run the lint
      - name: reviewdog (eslint)
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.REVIEWDOG_TOKEN }}
        uses: reviewdog/action-eslint@v1.34.0
        with:
          github_token :  ${{ secrets.REVIEWDOG_TOKEN }}
          reporter: github-pr-review
          eslint_flags: ""

      - name: reviewdog (shellcheck)
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.REVIEWDOG_TOKEN }}
        uses: reviewdog/action-shellcheck@v1.32.1
        with:
          github_token : ${{ secrets.REVIEWDOG_TOKEN }}
          reporter: github-pr-review
